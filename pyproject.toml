[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chileatiende-a-tiempo"
version = "0.1.0"
description = "MVP de orientación para jubilación y PGU con continuidad entre canales"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35,<2",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
